<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="nodeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>
    
    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Rounded Square) -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />

  <!-- Code/DSA visual elements (Connected Graph/Tree structure) -->
  <!-- Connection Lines -->
  <line x1="38" y1="90" x2="64" y2="38" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="90" y1="90" x2="64" y2="38" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="38" y1="90" x2="90" y2="90" stroke="url(#lineGrad)" stroke-width="4" stroke-dasharray="8,6" stroke-linecap="round" />

  <!-- Visualizer Array Brackets / Framing outline -->
  <path d="M 22,44 L 16,44 L 16,84 L 22,84" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <path d="M 106,44 L 112,44 L 112,84 L 106,84" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />

  <!-- Graph Nodes -->
  <!-- Top Node (Root/Parent) -->
  <circle cx="64" cy="38" r="16" fill="url(#nodePurple)" stroke="#c084fc" stroke-width="2.5" filter="url(#glow)" />
  <!-- Left Node -->
  <circle cx="38" cy="90" r="14" fill="url(#nodeBlue)" stroke="#60a5fa" stroke-width="2.5" filter="url(#glow)" />
  <!-- Right Node -->
  <circle cx="90" cy="90" r="14" fill="url(#nodeCyan)" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)" />

  <!-- Visual Node Details (Tiny centers for scientific look) -->
  <circle cx="64" cy="38" r="5" fill="#ffffff" />
  <circle cx="38" cy="90" r="4" fill="#ffffff" />
  <circle cx="90" cy="90" r="4" fill="#ffffff" />
</svg>