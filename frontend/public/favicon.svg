<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base (Rounded Square with subtle border) -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer glowing background rings for depth -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#3b82f6" stroke-opacity="0.05" stroke-width="8" />

  <!-- Code Brackets (Sleek, rounded caps) -->
  <!-- Left Bracket < -->
  <path d="M 36,36 L 16,64 L 36,92" fill="none" stroke="url(#purpleGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Right Bracket > -->
  <path d="M 92,36 L 112,64 L 92,92" fill="none" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Binary Tree Structure (The DSA elements inside) -->
  <!-- Connection Lines -->
  <line x1="64" y1="46" x2="48" y2="82" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
  <line x1="64" y1="46" x2="80" y2="82" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />

  <!-- Root Node -->
  <circle cx="64" cy="46" r="13" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  <circle cx="64" cy="46" r="4" fill="#ffffff" />

  <!-- Left Child Node -->
  <circle cx="48" cy="82" r="10" fill="url(#purpleGrad)" stroke="#f472b6" stroke-width="2" filter="url(#glow)" />
  <circle cx="48" cy="82" r="3" fill="#ffffff" />

  <!-- Right Child Node -->
  <circle cx="80" cy="82" r="10" fill="url(#cyanGrad)" stroke="#67e8f9" stroke-width="2" filter="url(#glow)" />
  <circle cx="80" cy="82" r="3" fill="#ffffff" />
</svg>